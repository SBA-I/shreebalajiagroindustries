<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shree Balaji Agro Industries | Agricultural Solutions</title>
    <meta name="description" content="Premium pesticides, insecticides, and crop protection solutions for modern farming. Trusted by distributors and farmers across India." />
    <meta name="author" content="Shree Balaji Agro Industries" />
    <meta property="og:title" content="Shree Balaji Agro Industries" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Hidden Google Translate widget for whole-site auto-translation (used as fallback by I18nProvider) -->
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      /* Hide every Google Translate UI surface */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .skiptranslate > iframe,
      .goog-te-gadget,
      .goog-te-gadget-simple,
      .goog-te-gadget-icon,
      .goog-logo-link,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight,
      #goog-gt-tt,
      #google_translate_element { display: none !important; visibility: hidden !important; }
      body { top: 0 !important; position: static !important; }
      html { margin-top: 0 !important; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
